[package]
name = "gloc-diff"
version = "0.2.0"
edition = "2024"

readme = "README.md"
license = "MIT"

description = "CLI that reports churn between git diffs."
documentation = "https://docs.rs/crate/gloc-diff/latest"
repository = "https://github.com/NoahSchiro/gloc-diff"

[[bin]]
name = "gloc"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
globset = "0.4.21"
ignore = "0.4.34"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
tabled = "0.22.0"
toml = "1.1.8"
tree-sitter = "0.27.1"
tree-sitter-rust = "0.24.2"
