name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.artifact }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: gloc-x86_64-linux-musl
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: gloc-aarch64-macos
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: gloc-x86_64-macos
    runs-on: ${{ matrix.os }}
    env:
      # cc-rs would find musl-gcc on its own for this target; pin it
      # so the tree-sitter C code is always compiled against musl.
      # Other targets ignore the variable.
      CC_x86_64_unknown_linux_musl: musl-gcc
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install the musl toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools musl-dev

      - name: Test
        run: cargo test --all-features

      - name: Build
        run: cargo build --release --all-features --target ${{ matrix.target }}

      - name: Check the binary runs
        run: |
          file --brief target/${{ matrix.target }}/release/gloc
          target/${{ matrix.target }}/release/gloc --version

      - name: Check the musl binary is fully static
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          ! readelf --program-headers target/${{ matrix.target }}/release/gloc | grep --quiet INTERP

      - name: Package
        run: |
          tar --create --gzip --file ${{ matrix.artifact }}.tar.gz \
            --directory target/${{ matrix.target }}/release gloc

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksum
        run: |
          cd dist
          sha256sum gloc-*.tar.gz > SHA256SUMS

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/gloc-*.tar.gz
            dist/SHA256SUMS
          fail_on_unmatched_files: true
          generate_release_notes: true
