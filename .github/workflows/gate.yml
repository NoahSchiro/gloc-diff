name: gloc

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: gloc-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  report:
    name: gloc report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gloc diffs from the merge-base with the base branch, so the
          # checkout needs full history for that merge-base to exist.
          fetch-depth: 0

      - name: Download gloc
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo "$GITHUB_REPOSITORY" \
            --pattern 'gloc-x86_64-linux-musl.tar.gz' --clobber
          tar --extract --gzip --file gloc-x86_64-linux-musl.tar.gz
          chmod +x gloc

      - name: Build the report
        run: |
          set +e
          ./gloc --base "origin/${{ github.base_ref }}" --style markdown \
            --max-src 100 --max-test 100 --max-total 500 \
            > report.md 2> limits.txt
          status=$?
          set -e
          if [ "$status" -ge 2 ]; then
            cat limits.txt >&2
            exit 1
          fi
          {
            echo "<!-- gloc report: do not edit -->"
            echo "## gloc report"
            echo
            cat report.md
            echo
            if [ "$status" -eq 1 ]; then
              echo "> [!WARNING]"
              echo "> This PR exceeds the churn limits. Consider scoping it down"
              echo "> or splitting it into smaller PRs."
              echo
              echo '```'
              cat limits.txt
              echo '```'
            else
              echo "✅ Within churn limits."
            fi
          } > comment.md

      - name: Post the report
        # Fork PRs get a read-only token and cannot comment; the report is
        # still visible in this run's log.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number="${{ github.event.pull_request.number }}"
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$number/comments" \
            --jq '.[] | select(.body | startswith("<!-- gloc report:")) | .id' | head -1)
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" \
              -F body=@comment.md > /dev/null
          else
            gh pr comment "$number" --body-file comment.md
          fi
